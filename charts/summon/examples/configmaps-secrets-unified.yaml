# ConfigMaps and Secrets Unified Example
# Demonstrates all contentTypes: env, file, yaml, json
# Replaces: configmap-*, deployment-with-config*, deployment-with-secret*

name: config-showcase

spellbook:
  name: examples
chapter:
  name: demo

workload:
  enabled: true
  type: deployment
  replicas: 1

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

service:
  enabled: true
  ports:
    - port: 80
      name: http

# ====== ConfigMaps ======
configMaps:
  # ENV type: All keys become environment variables via envFrom
  app-env:
    location: create
    contentType: env
    content:
      DATABASE_HOST: postgres.local
      DATABASE_PORT: "5432"
      CACHE_HOST: redis.local
      CACHE_PORT: "6379"
      LOG_LEVEL: info

  # ENV type: Reference existing ConfigMap (not created by summon)
  external-env:
    location: local
    contentType: env
    # This references an existing ConfigMap in the cluster

  # FILE type: Plain text file mounted at path
  nginx-conf:
    location: create
    contentType: file
    name: nginx.conf
    mountPath: /etc/nginx/conf.d
    content: |
      server {
        listen 80;
        server_name localhost;

        location / {
          root /usr/share/nginx/html;
          index index.html;
        }

        location /health {
          return 200 "OK";
          add_header Content-Type text/plain;
        }
      }

  # YAML type: YAML-formatted config file
  app-config-yaml:
    location: create
    contentType: yaml
    name: config.yml
    mountPath: /app/config
    content:
      server:
        host: 0.0.0.0
        port: 8080
        timeout: 30
      database:
        host: postgres.local
        port: 5432
        pool_size: 10
      features:
        cache_enabled: true
        metrics_enabled: true
        debug_mode: false

  # JSON type: JSON-formatted config file
  app-config-json:
    location: create
    contentType: json
    name: settings.json
    mountPath: /app/settings
    content:
      api:
        version: "v1"
        rate_limit: 1000
      features:
        - authentication
        - authorization
        - rate_limiting
      timeouts:
        connect: 5
        read: 30
        write: 30

# ====== Secrets ======
secrets:
  # ENV type: All keys become environment variables via envFrom
  db-credentials:
    location: create
    contentType: env
    content:
      DB_USER: appuser
      DB_PASS: supersecret123
      DB_NAME: appdb

  # ENV type: Reference existing secret (e.g., created by Vault)
  vault-secret:
    location: local
    contentType: env
    # This references an existing Secret in the cluster

  # FILE type: Certificate/key file
  tls-cert:
    location: create
    contentType: file
    name: tls.crt
    mountPath: /etc/ssl/certs
    content: |
      -----BEGIN CERTIFICATE-----
      MIIDXTCCAkWgAwIBAgIJAKLdQVPy90WjMA0GCSqGSIb3DQEBCwUAMEUxCzAJBgNV
      BAYTAkFVMRMwEQYDVQQIDApTb21lLVN0YXRlMSEwHwYDVQQKDBhJbnRlcm5ldCBX
      aWRnaXRzIFB0eSBMdGQwHhcNMjEwMTAxMDAwMDAwWhcNMjIwMTAxMDAwMDAwWjBF
      -----END CERTIFICATE-----

  # YAML type: Secrets in YAML format
  api-keys-yaml:
    location: create
    contentType: yaml
    name: api-keys.yml
    mountPath: /app/secrets
    content:
      stripe:
        public_key: pk_live_xxx
        secret_key: sk_live_xxx
      sendgrid:
        api_key: SG.xxx
      twilio:
        account_sid: ACxxx
        auth_token: xxx

# Direct environment variables (simple key-value)
envs:
  APP_ENV: production
  SERVICE_NAME: config-showcase
  # From Secret
  ADMIN_PASSWORD:
    type: secret
    name: db-credentials
    key: DB_PASS
  # From ConfigMap
  LOG_LEVEL:
    type: configmap
    name: app-env
    key: LOG_LEVEL

# Resource limits
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# ServiceAccount
serviceAccount:
  enabled: true
