# Security Hardened Example
# Complete security configuration: pod/container contexts, runtime class, restrictive SA
# Replaces: security-context-separation, deployment-with-runtime-class

name: secure-api

spellbook:
  name: security-examples
chapter:
  name: production

workload:
  enabled: true
  type: deployment
  replicas: 2
  # Container-level security context
  # Only container-valid fields: capabilities, privileged, allowPrivilegeEscalation, etc.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop:
        - ALL
      # Only add capabilities if absolutely necessary
      # add:
      #   - NET_BIND_SERVICE

# Runtime class for sandboxed execution (gVisor, Kata Containers)
# Provides additional isolation at the container runtime level
runtimeClassName: gvisor

image:
  repository: myorg/secure-api
  tag: v1.0.0
  pullPolicy: Always

# Pod-level security context
# Only pod-valid fields: runAsUser, runAsGroup, fsGroup, runAsNonRoot, etc.
securityContext:
  runAsUser: 65534                       # nobody user
  runAsGroup: 65534                      # nogroup
  fsGroup: 65534
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Service configuration
service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http

# Restrictive ServiceAccount
serviceAccount:
  enabled: true
  automount: false                       # Don't auto-mount SA token
  annotations:
    # IRSA for AWS (if needed)
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/minimal-role
  labels:
    security.kubernetes.io/restricted: "true"

# Health probes
probes:
  liveness:
    type: httpGet
    path: /healthz
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    type: httpGet
    path: /ready
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10

# Resource limits (required for security)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# EmptyDir for writable tmp (since readOnlyRootFilesystem: true)
volumes:
  tmp:
    type: emptyDir
    destinationPath: /tmp
    sizeLimit: 100Mi
  cache:
    type: emptyDir
    destinationPath: /var/cache
    sizeLimit: 50Mi

# Environment variables (no sensitive data in plain text)
envs:
  LOG_LEVEL: info
  APP_ENV: production
  # Sensitive values from secrets only
  API_KEY:
    type: secret
    name: api-credentials
    key: api_key

# Secrets via envFrom
secrets:
  api-credentials:
    contentType: env
    location: local

# Network policy labels (for use with NetworkPolicies)
podLabels:
  network-policy: restricted
  security-tier: high

# Pod annotations
podAnnotations:
  seccomp.security.alpha.kubernetes.io/pod: runtime/default

# Node scheduling for secure nodes
nodeSelector:
  node.kubernetes.io/instance-type: t3.medium
  security-zone: restricted

tolerations:
  - key: "security"
    operator: "Equal"
    value: "high"
    effect: "NoSchedule"

# Labels
labels:
  finops:
    enabled: true
    team: security
    project: secure-api
    costCenter: security-ops
